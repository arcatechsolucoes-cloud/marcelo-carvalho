<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 900" width="600" height="900" role="img" aria-labelledby="t1 d1">
  <title id="t1">O Limite do Invisível</title>
  <desc id="d1">Capa do livro O Limite do Invisível, de Marcelo Carvalho. Fundo escuro com círculos dourados.</desc>
  <defs>
    <linearGradient id="c1bg" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#221C14"/>
      <stop offset="1" stop-color="#100E0B"/>
    </linearGradient>
    <radialGradient id="c1glow" cx="0.5" cy="0.42" r="0.62">
      <stop offset="0" stop-color="#C6A15B" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#C6A15B" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="c1clip"><rect x="0" y="0" width="600" height="900"/></clipPath>
  </defs>

  <rect width="600" height="900" fill="url(#c1bg)"/>
  <rect width="600" height="900" fill="url(#c1glow)"/>

  <g clip-path="url(#c1clip)">
    <circle cx="300" cy="392" r="208" fill="none" stroke="#C6A15B" stroke-opacity="0.34" stroke-width="1"/>
    <circle cx="300" cy="392" r="158" fill="none" stroke="#C6A15B" stroke-opacity="0.16" stroke-width="1"/>
    <circle cx="300" cy="392" r="6" fill="#C6A15B" fill-opacity="0.5"/>
  </g>

  <rect x="30" y="30" width="540" height="840" fill="none" stroke="#C6A15B" stroke-opacity="0.26" stroke-width="1"/>

  <g font-family="Georgia, 'Liberation Serif', 'Times New Roman', serif" text-anchor="middle">
    <text x="300" y="128" font-size="15" letter-spacing="7" fill="#8B7746" font-family="'Liberation Sans', Helvetica, Arial, sans-serif">LIVRO I</text>

    <text x="300" y="374" font-size="64" letter-spacing="0.5" fill="#EDE7D8">O Limite</text>
    <text x="300" y="446" font-size="64" letter-spacing="0.5" fill="#EDE7D8">do Invisível</text>

    <line x1="216" y1="494" x2="384" y2="494" stroke="#C6A15B" stroke-opacity="0.6"/>

    <text x="300" y="546" font-size="22" font-style="italic" fill="#C6A15B">Nada neste mundo</text>
    <text x="300" y="578" font-size="22" font-style="italic" fill="#C6A15B">consegue te completar</text>
  </g>

  <g text-anchor="middle">
    <path d="M300 742 l7 7 -7 7 -7 -7 z" fill="#C6A15B" fill-opacity="0.75"/>
    <text x="300" y="812" font-size="15" letter-spacing="5.5" fill="#A79E8B" font-family="'Liberation Sans', Helvetica, Arial, sans-serif">MARCELO CARVALHO</text>
  </g>
</svg>
